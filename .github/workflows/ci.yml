name: meetmind-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meetmind_ci
          POSTGRES_USER: meetmind_owner
          POSTGRES_PASSWORD: meetmind-owner-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetmind_owner -d meetmind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Create limited PostgreSQL role
        env:
          PGPASSWORD: meetmind-owner-ci-password
        run: |
          psql -h localhost -U meetmind_owner -d meetmind_ci <<'SQL'
          CREATE ROLE meetmind_app LOGIN PASSWORD 'meetmind-app-ci-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE meetmind_ci TO meetmind_app;
          GRANT USAGE ON SCHEMA public TO meetmind_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE meetmind_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO meetmind_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE meetmind_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO meetmind_app;
          SQL
      - run: python -m ruff check app tests tools config.py
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Validate JavaScript
        shell: bash
        run: for file in app/static/js/*.js; do node --check "$file"; done
      - name: Validate migrations on SQLite
        env:
          DATABASE_URL: sqlite:////tmp/meetmind-migration.sqlite3
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
        run: flask --app run.py db upgrade
      - name: Validate migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://meetmind_owner:meetmind-owner-ci-password@localhost:5432/meetmind_ci
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
        run: flask --app run.py db upgrade
      - name: Verify PostgreSQL FORCE RLS with application role
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://meetmind_owner:meetmind-owner-ci-password@localhost:5432/meetmind_ci
          DATABASE_URL: postgresql+psycopg://meetmind_app:meetmind-app-ci-password@localhost:5432/meetmind_ci
        run: python tools/verify_postgres_rls.py
      - run: python tools/evaluate_ai_quality.py evaluations/gold.sample.jsonl --validate-only
      - run: pip-audit -r requirements.txt

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: meetmind-ci:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meetmind-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: meetmind-ci:${{ github.sha }}
          format: spdx-json
          output-file: meetmind-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: meetmind-sbom
          path: meetmind-sbom.spdx.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          # O repositório privado ainda não possui Code scanning habilitado.
          # A análise continua sendo executada e o SARIF fica disponível como artefato.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meetmind-codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
